seed: 42
tz_offset_hours: 8
coord_scale: 1000000.0
clean:
  min_total_time_min: 5.0
  max_total_time_min: 90.0
features:
  target_encoding_smoothing: 10
  target_encoding_folds: 5
  demand_window_seconds: 1200
split:
  max_samples: 500000
  test_size: 0.30
  val_fraction_of_rest: 0.3333333333333333
models:
  random_forest:
    n_estimators: 100
    reduced:
      max_depth: 16
      min_samples_split: 10
    complete:
      max_depth: 18
      min_samples_split: 8
  hist_gradient_boosting:
    max_iter: 500
    learning_rate: 0.08
    max_leaf_nodes: 31
    early_stopping: true
    validation_fraction: 0.15
    n_iter_no_change: 20
  lightgbm:
    n_estimators:
      reduced: 300
      complete: 350
    learning_rate: 0.05
    num_leaves: 31
mlflow:
  experiment_name: meituan-eta
  tracking_uri: sqlite:///mlflow.db
smoke:
  max_samples: 5000
  n_estimators: 20
  max_iter: 20
